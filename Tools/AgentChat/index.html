<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodexTactics — Чат Агентов (Claude ↔ Gemini ↔ Дизайнер)</title>
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #273549;
      --bg-input: #0b1120;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --color-claude: #f59e0b;
      --color-claude-bg: rgba(245, 158, 11, 0.12);
      --color-gemini: #38bdf8;
      --color-gemini-bg: rgba(56, 189, 248, 0.12);
      --color-codex: #34d399;
      --color-codex-bg: rgba(52, 211, 153, 0.12);
      --color-designer: #c084fc;
      --color-designer-bg: rgba(192, 132, 252, 0.15);
      
      --status-active: #22c55e;
      --status-offline: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-tag {
      font-size: 11px;
      background: #334155;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .presence-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    .presence-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-offline);
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--status-active);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    /* Main chat container */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-width: 92%;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .message.from-claude {
      background-color: var(--color-claude-bg);
      border-color: rgba(245, 158, 11, 0.3);
      align-self: flex-start;
    }

    .message.from-gemini {
      background-color: var(--color-gemini-bg);
      border-color: rgba(56, 189, 248, 0.3);
      align-self: flex-start;
    }

    .message.from-designer {
      background-color: var(--color-designer-bg);
      border-color: rgba(192, 132, 252, 0.35);
      align-self: flex-end;
    }

    .msg-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 11.5px;
    }

    .msg-author {
      font-weight: 700;
      text-transform: capitalize;
    }
    .from-claude .msg-author { color: var(--color-claude); }
    .from-gemini .msg-author { color: var(--color-gemini); }
    .message.from-codex { background-color: var(--color-codex-bg); }
    .from-codex .msg-author { color: var(--color-codex); }
    .from-designer .msg-author { color: var(--color-designer); }

    .msg-target {
      color: var(--text-dim);
      font-weight: 500;
    }

    .msg-topic {
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #cbd5e1;
      margin-left: 6px;
    }

    .msg-time {
      color: var(--text-dim);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .msg-text {
      white-space: pre-wrap;
      color: #f1f5f9;
    }

    /* Input area */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .form-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    select, input[type="text"], textarea {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #38bdf8;
    }

    select {
      cursor: pointer;
    }

    .topic-input {
      width: 180px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    button#send-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0 18px;
      height: 48px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    button#send-btn:hover {
      background: #0369a1;
    }

    button#send-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .alert-banner {
      display: none;
      padding: 6px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 12px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .tab-btn {
      background: #0b1120;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Board view */
    #board-view {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      flex-direction: column;
      gap: 14px;
    }
    #board-view.visible {
      display: flex;
    }
    #chat-view-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    #chat-view-wrapper.hidden {
      display: none;
    }

    .now-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .now-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .now-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }
    .owner-claude { color: var(--color-claude); }
    .owner-gemini { color: var(--color-gemini); }
    .owner-codex { color: var(--color-codex); }
    .owner-designer { color: var(--color-designer); }

    .idle-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .board-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .board-filters select, .board-filters input {
      font-size: 12px;
      padding: 5px 8px;
    }
    .refresh-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #334155; }

    .board-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .board-col {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .board-col-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .task-card {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }
    .task-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .task-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800;
      color: #f8fafc;
    }
    .owner-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }
    .task-title {
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.35;
    }
    .task-meta {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .task-chat-line {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      border-left: 2px solid #475569;
      padding: 3px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .doc-link {
      font-size: 11px;
      color: #38bdf8;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Read-only doc modal */
    #doc-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #doc-modal.open { display: flex; }
    .doc-modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      max-width: 780px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .doc-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 700;
    }
    .doc-modal-body {
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #e2e8f0;
    }

    @media (max-width: 720px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
      }
      .presence-bar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .board-columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title">
        <span>CodexTactics</span>
        <span class="header-tag">Дизайнер</span>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-chat">Чат</button>
        <button class="tab-btn" id="tab-board">Задачи</button>
      </div>
    </div>
    <div class="presence-bar">
      <div class="presence-item" id="presence-claude" title="Claude Code">
        <span class="status-dot" id="dot-claude"></span>
        <span>Claude: <strong id="status-claude">офлайн</strong></span>
      </div>
      <div class="presence-item" id="presence-gemini" title="Gemini Antigravity">
        <span class="status-dot" id="dot-gemini"></span>
        <span>Gemini: <strong id="status-gemini">офлайн</strong></span>
      </div>
      <div class="presence-item" id="presence-codex" title="Codex (OpenAI)">
        <span class="status-dot" id="dot-codex"></span>
        <span>Codex: <strong id="status-codex">офлайн</strong></span>
      </div>
    </div>
  </header>

  <div id="chat-view-wrapper">
  <main id="messages-container">
    <!-- Messages injected by JS -->
  </main>

  <footer>
    <div class="alert-banner" id="error-banner"></div>
    <div class="form-controls">
      <div class="control-group">
        <label for="to-select">Кому:</label>
        <select id="to-select">
          <option value="all">Все (all)</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
          <option value="codex">Codex</option>
        </select>
      </div>

      <div class="control-group">
        <label for="topic-input">Тема:</label>
        <input type="text" id="topic-input" class="topic-input" placeholder="например: combat_lab, bugs" />
      </div>
    </div>

    <div class="input-row">
      <textarea id="message-text" placeholder="Сообщение для агентов... (Enter — отправить, Shift+Enter — перенос строки)"></textarea>
      <button id="send-btn">Отправить</button>
    </div>
  </footer>
  </div>

  <section id="board-view" aria-label="Живая доска задач">
    <div class="now-strip" id="now-strip"></div>
    <div class="board-filters">
      <select id="filter-owner">
        <option value="all">Все агенты</option>
        <option value="codex">Codex</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
      </select>
      <select id="filter-state">
        <option value="all">Все статусы</option>
        <option value="in_progress">В работе</option>
        <option value="waiting">Ждёт ответа</option>
        <option value="queued">В очереди</option>
        <option value="done">Готово (ревью)</option>
        <option value="in_interim">В interim</option>
        <option value="in_main">В main</option>
        <option value="not_started">Не начато (реестр)</option>
      </select>
      <select id="filter-area">
        <option value="all">Все области</option>
      </select>
      <input type="text" id="filter-search" placeholder="Поиск (id / тема)..." />
      <button class="refresh-btn" id="refresh-board-btn">Обновить</button>
      <span class="idle-badge" id="board-updated-at">загрузка...</span>
    </div>
    <div class="board-columns" id="board-columns"></div>
  </section>

  <div id="doc-modal" role="dialog" aria-modal="true">
    <div class="doc-modal-card">
      <div class="doc-modal-head">
        <span id="doc-modal-title">Документ</span>
        <button class="refresh-btn" id="doc-modal-close">Закрыть</button>
      </div>
      <div class="doc-modal-body" id="doc-modal-body"></div>
    </div>
  </div>

  <script>
    (function () {
      const container = document.getElementById('messages-container');
      const textInput = document.getElementById('message-text');
      const sendBtn = document.getElementById('send-btn');
      const toSelect = document.getElementById('to-select');
      const topicInput = document.getElementById('topic-input');
      const errorBanner = document.getElementById('error-banner');
      
      const dotClaude = document.getElementById('dot-claude');
      const statusClaude = document.getElementById('status-claude');
      const dotGemini = document.getElementById('dot-gemini');
      const statusGemini = document.getElementById('status-gemini');

      let lastMessageId = 0;
      let shouldAutoScroll = true;

      // Track user scrolling
      container.addEventListener('scroll', () => {
        const threshold = 60;
        shouldAutoScroll = (container.scrollHeight - container.scrollTop - container.clientHeight) < threshold;
      });

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        setTimeout(() => {
          errorBanner.style.display = 'none';
        }, 6000);
      }

      function formatTime(isoStr) {
        if (!isoStr) return '';
        try {
          const d = new Date(isoStr);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        } catch {
          return isoStr.split('T')[1]?.slice(0, 8) || isoStr;
        }
      }

      function renderMessage(msg) {
        const div = document.createElement('div');
        const from = (msg.from || 'unknown').toLowerCase();
        div.className = `message from-${from}`;

        const header = document.createElement('div');
        header.className = 'msg-header';

        const leftInfo = document.createElement('div');
        const author = document.createElement('span');
        author.className = 'msg-author';
        author.textContent = msg.from;
        leftInfo.appendChild(author);

        const target = document.createElement('span');
        target.className = 'msg-target';
        target.textContent = ` → ${msg.to}`;
        leftInfo.appendChild(target);

        if (msg.topic) {
          const topic = document.createElement('span');
          topic.className = 'msg-topic';
          topic.textContent = msg.topic;
          leftInfo.appendChild(topic);
        }

        const time = document.createElement('span');
        time.className = 'msg-time';
        time.textContent = `${formatTime(msg.ts)} (#${msg.id})`;

        header.appendChild(leftInfo);
        header.appendChild(time);

        const text = document.createElement('div');
        text.className = 'msg-text';
        text.textContent = msg.text;

        div.appendChild(header);
        div.appendChild(text);
        return div;
      }

      async function fetchMessages() {
        try {
          const res = await fetch(`/api/messages?since=${lastMessageId}`);
          if (!res.ok) return;
          const data = await res.json();
          const msgs = data.messages || [];
          if (msgs.length > 0) {
            msgs.forEach(m => {
              container.appendChild(renderMessage(m));
              if (m.id > lastMessageId) lastMessageId = m.id;
            });
            if (shouldAutoScroll) {
              container.scrollTop = container.scrollHeight;
            }
          }
        } catch (e) {
          console.warn('Error fetching messages:', e);
        }
      }

      async function fetchPresence() {
        try {
          const res = await fetch('/api/presence');
          if (!res.ok) return;
          const pres = await res.json();
          
          if (pres.claude && pres.claude.active) {
            dotClaude.className = 'status-dot active';
            statusClaude.textContent = 'слушает';
          } else {
            dotClaude.className = 'status-dot';
            statusClaude.textContent = 'офлайн';
          }

          if (pres.gemini && pres.gemini.active) {
            dotGemini.className = 'status-dot active';
            statusGemini.textContent = 'слушает';
          } else {
            dotGemini.className = 'status-dot';
            statusGemini.textContent = 'офлайн';
          }
          const dotCodex = document.getElementById('dot-codex');
          const statusCodex = document.getElementById('status-codex');
          if (dotCodex && statusCodex) {
            const codexOn = !!(pres.codex && pres.codex.active);
            dotCodex.className = codexOn ? 'status-dot active' : 'status-dot';
            statusCodex.textContent = codexOn ? 'слушает' : 'офлайн';
          }
        } catch (e) {
          console.warn('Error fetching presence:', e);
        }
      }

      async function sendMessage() {
        const text = textInput.value.trim();
        if (!text) return;

        const to = toSelect.value;
        const topic = topicInput.value.trim();

        sendBtn.disabled = true;
        try {
          const res = await fetch('/api/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to, topic, text })
          });
          const result = await res.json();
          if (res.ok && result.success) {
            textInput.value = '';
            shouldAutoScroll = true;
            await fetchMessages();
          } else {
            showError(result.error || 'Ошибка отправки сообщения');
          }
        } catch (e) {
          showError(`Сетевая ошибка: ${e.message}`);
        } finally {
          sendBtn.disabled = false;
          textInput.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Initial loads & polling loops
      fetchMessages();
      fetchPresence();
      setInterval(fetchMessages, 2000);
      setInterval(fetchPresence, 2000);

      // --- Живая доска задач (031) ---
      const tabChat = document.getElementById('tab-chat');
      const tabBoard = document.getElementById('tab-board');
      const chatWrapper = document.getElementById('chat-view-wrapper');
      const boardView = document.getElementById('board-view');
      const nowStrip = document.getElementById('now-strip');
      const boardCols = document.getElementById('board-columns');
      const filterOwner = document.getElementById('filter-owner');
      const filterState = document.getElementById('filter-state');
      const filterArea = document.getElementById('filter-area');
      const filterSearch = document.getElementById('filter-search');
      const refreshBoardBtn = document.getElementById('refresh-board-btn');
      const boardUpdatedAt = document.getElementById('board-updated-at');
      const docModal = document.getElementById('doc-modal');
      const docModalTitle = document.getElementById('doc-modal-title');
      const docModalBody = document.getElementById('doc-modal-body');
      const docModalClose = document.getElementById('doc-modal-close');

      let boardData = null;

      function switchTab(tabName) {
        const isBoard = tabName === 'board';
        tabChat.classList.toggle('active', !isBoard);
        tabBoard.classList.toggle('active', isBoard);
        chatWrapper.classList.toggle('hidden', isBoard);
        boardView.classList.toggle('visible', isBoard);
        if (isBoard && !boardData) {
          fetchBoard(false);
        }
      }

      tabChat.addEventListener('click', () => switchTab('chat'));
      tabBoard.addEventListener('click', () => switchTab('board'));

      async function openPortDoc(relPath) {
        docModalTitle.textContent = relPath;
        docModalBody.textContent = 'Загрузка...';
        docModal.classList.add('open');
        try {
          const res = await fetch(`/api/port-doc?path=${encodeURIComponent(relPath)}`);
          const data = await res.json();
          docModalBody.textContent = res.ok ? data.content : (data.error || 'Не удалось загрузить файл');
        } catch (err) {
          docModalBody.textContent = `Ошибка: ${err.message}`;
        }
      }

      docModalClose.addEventListener('click', () => docModal.classList.remove('open'));
      docModal.addEventListener('click', (e) => {
        if (e.target === docModal) docModal.classList.remove('open');
      });

      function renderBoard() {
        if (!boardData) return;
        boardUpdatedAt.textContent = `обновлено: ${formatTime(boardData.generated_at)}`;

        // Areas dropdown
        const prevArea = filterArea.value;
        filterArea.innerHTML = '<option value="all">Все области</option>';
        (boardData.areas || []).forEach(a => {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          filterArea.appendChild(opt);
        });
        if (prevArea && [...filterArea.options].some(o => o.value === prevArea)) {
          filterArea.value = prevArea;
        }

        // Now strip
        nowStrip.innerHTML = '';
        ['codex', 'gemini', 'claude'].forEach(ag => {
          const info = (boardData.now_strip || {})[ag] || { agent: ag, state: 'idle' };
          const card = document.createElement('div');
          card.className = 'now-card';

          const head = document.createElement('div');
          head.className = 'now-card-head';
          const nameSpan = document.createElement('span');
          nameSpan.className = `owner-${ag}`;
          nameSpan.textContent = ag.toUpperCase();
          const idleSpan = document.createElement('span');
          idleSpan.className = 'idle-badge';
          idleSpan.textContent = info.idle_min !== null && info.idle_min !== undefined
            ? `idle for ${info.idle_min} min`
            : 'нет данных';
          head.appendChild(nameSpan);
          head.appendChild(idleSpan);

          const body = document.createElement('div');
          body.className = 'task-meta';
          body.textContent = info.task_id
            ? `${info.task_id} (${info.state}): ${info.task_title || ''}`
            : 'нет активной задачи';

          card.appendChild(head);
          card.appendChild(body);
          nowStrip.appendChild(card);
        });

        const ownerVal = filterOwner.value;
        const stateVal = filterState.value;
        const areaVal = filterArea.value;
        const q = filterSearch.value.trim().toLowerCase();

        const columnsDef = [
          ['in_progress', 'В работе'],
          ['waiting', 'Ждёт ответа / блокер'],
          ['queued', 'В очереди'],
          ['done', 'Готово (ревью)'],
          ['in_interim', 'В interim'],
          ['in_main', 'В main'],
        ];

        boardCols.innerHTML = '';
        if (stateVal !== 'not_started') {
          columnsDef.forEach(([stKey, stLabel]) => {
            if (stateVal !== 'all' && stateVal !== stKey) return;
            const list = (boardData.tasks || []).filter(t => {
              if (t.state !== stKey) return false;
              if (ownerVal !== 'all' && t.owner !== ownerVal) return false;
              if (areaVal !== 'all' && t.area !== areaVal) return false;
              if (q && !(t.id + ' ' + t.title + ' ' + (t.title_ru || '') + ' ' + (t.branch || '')).toLowerCase().includes(q)) return false;
              return true;
            });

            const col = document.createElement('div');
            col.className = 'board-col';
            const colHead = document.createElement('div');
            colHead.className = 'board-col-title';
            const titleSpan = document.createElement('span');
            titleSpan.textContent = stLabel;
            const countSpan = document.createElement('span');
            countSpan.textContent = String(list.length);
            colHead.appendChild(titleSpan);
            colHead.appendChild(countSpan);
            col.appendChild(colHead);

            list.forEach(t => {
              const card = document.createElement('div');
              card.className = 'task-card';

              const top = document.createElement('div');
              top.className = 'task-card-top';
              const idEl = document.createElement('span');
              idEl.className = 'task-id';
              idEl.textContent = t.id;
              const ownerEl = document.createElement('span');
              ownerEl.className = `owner-pill owner-${t.owner}`;
              ownerEl.textContent = t.moved_note ? `${t.owner} (${t.moved_note})` : t.owner;
              top.appendChild(idEl);
              top.appendChild(ownerEl);
              card.appendChild(top);

              const titleEl = document.createElement('div');
              titleEl.className = 'task-title';
              titleEl.textContent = t.title_ru && t.title_ru !== t.title ? `${t.title_ru} · ${t.title}` : t.title;
              card.appendChild(titleEl);

              if (t.branch || t.idle_min !== null) {
                const metaEl = document.createElement('div');
                metaEl.className = 'task-meta';
                const parts = [];
                if (t.branch) parts.push(`${t.branch}${t.last_commit ? ' @ ' + t.last_commit : ''}`);
                if (t.idle_min !== null) parts.push(`idle ${t.idle_min}m`);
                metaEl.textContent = parts.join(' · ');
                card.appendChild(metaEl);
              }

              if (t.last_chat_text) {
                const chatEl = document.createElement('div');
                chatEl.className = 'task-chat-line';
                chatEl.textContent = t.last_chat_text;
                card.appendChild(chatEl);
              }

              const linksEl = document.createElement('div');
              linksEl.className = 'task-links';
              const taskBtn = document.createElement('button');
              taskBtn.className = 'doc-link';
              taskBtn.textContent = 'Задача';
              taskBtn.addEventListener('click', () => openPortDoc(t.task_file));
              linksEl.appendChild(taskBtn);
              if (t.report_file) {
                const repBtn = document.createElement('button');
                repBtn.className = 'doc-link';
                repBtn.textContent = 'Отчёт';
                repBtn.addEventListener('click', () => openPortDoc(t.report_file));
                linksEl.appendChild(repBtn);
              }
              card.appendChild(linksEl);
              col.appendChild(card);
            });

            boardCols.appendChild(col);
          });
        }

        if (stateVal === 'all' || stateVal === 'not_started') {
          const regList = (boardData.not_started_register || []).filter(r => {
            if (areaVal !== 'all' && r.area !== areaVal) return false;
            if (q && !(r.id + ' ' + r.name + ' ' + r.area).toLowerCase().includes(q)) return false;
            return true;
          }).slice(0, 40);
          if (regList.length > 0) {
            const col = document.createElement('div');
            col.className = 'board-col';
            const colHead = document.createElement('div');
            colHead.className = 'board-col-title';
            const titleSpan = document.createElement('span');
            titleSpan.textContent = 'Реестр без задачи (not started)';
            const countSpan = document.createElement('span');
            countSpan.textContent = String((boardData.not_started_register || []).length);
            colHead.appendChild(titleSpan);
            colHead.appendChild(countSpan);
            col.appendChild(colHead);

            regList.forEach(r => {
              const card = document.createElement('div');
              card.className = 'task-card';
              const top = document.createElement('div');
              top.className = 'task-card-top';
              const idEl = document.createElement('span');
              idEl.className = 'task-id';
              idEl.textContent = r.id;
              const areaEl = document.createElement('span');
              areaEl.className = 'idle-badge';
              areaEl.textContent = r.area || '';
              top.appendChild(idEl);
              top.appendChild(areaEl);
              const titleEl = document.createElement('div');
              titleEl.className = 'task-title';
              titleEl.textContent = r.name;
              card.appendChild(top);
              card.appendChild(titleEl);
              col.appendChild(card);
            });
            boardCols.appendChild(col);
          }
        }
      }

      async function fetchBoard(forceRefresh) {
        try {
          const res = await fetch(`/api/task-board${forceRefresh ? '?refresh=1' : ''}`);
          if (!res.ok) return;
          boardData = await res.json();
          renderBoard();
        } catch (err) {
          console.warn('Error fetching task board:', err);
        }
      }

      [filterOwner, filterState, filterArea].forEach(el => el.addEventListener('change', renderBoard));
      filterSearch.addEventListener('input', renderBoard);
      refreshBoardBtn.addEventListener('click', () => fetchBoard(true));
      setInterval(() => {
        if (boardView.classList.contains('visible')) {
          fetchBoard(false);
        }
      }, 30000);
    })();
  </script>
</body>
</html>
