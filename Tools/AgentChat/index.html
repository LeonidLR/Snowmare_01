<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodexTactics Chat</title>
  <link rel="icon" type="image/x-icon" href="/agent_chat.ico">
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #273549;
      --bg-input: #0b1120;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --color-claude: #f59e0b;
      --color-claude-bg: rgba(245, 158, 11, 0.12);
      --color-gemini: #38bdf8;
      --color-gemini-bg: rgba(56, 189, 248, 0.12);
      --color-codex: #34d399;
      --color-codex-bg: rgba(52, 211, 153, 0.12);
      --color-grok: #000000;
      --color-grok-bg: rgba(255, 255, 255, 0.08);
      --color-grok-outline: #ffffff;
      --color-designer: #c084fc;
      --color-designer-bg: rgba(192, 132, 252, 0.15);
      
      --status-active: #22c55e;
      --status-offline: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Editor status (designer 2026-11-25): a small dot button in the header, click expands the details. */
    #editor-banner { position: relative; display: inline-flex; align-items: center; margin: 0 10px; }
    #eb-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); background: #475569; cursor: pointer; padding: 0; }
    #editor-banner.GREEN #eb-btn { background: #16a34a; }
    #editor-banner.YELLOW #eb-btn { background: #f97316; }
    #editor-banner.RED #eb-btn { background: #dc2626; }
    #eb-pop { display: none; position: absolute; top: 30px; left: 0; z-index: 50; width: min(560px, 80vw); padding: 10px 12px; border-radius: 8px; color: #fff; background: #334155; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
    #editor-banner.open #eb-pop { display: block; }
    #editor-banner.GREEN #eb-pop { background: #15803d; }
    #editor-banner.YELLOW #eb-pop { background: #c2410c; }
    #editor-banner.RED #eb-pop { background: #b91c1c; }
    #editor-banner .eb-reason { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
    #editor-banner .eb-detail { font-size: 0.72rem; opacity: 0.9; margin-top: 6px; word-break: break-word; max-height: 40vh; overflow: auto; }

    /* Top bar */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-tag {
      font-size: 11px;
      background: #334155;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .presence-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    .presence-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-offline);
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background-color: var(--status-active);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    /* STATUS strip: latest progress line per agent */
    #status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      padding: 4px 16px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color, rgba(128,128,128,0.25));
    }
    #status-strip:empty { display: none; }
    #status-strip .st-item { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #status-strip .st-agent { font-weight: 600; text-transform: capitalize; }

    /* Main chat container */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-width: 92%;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .message.from-claude {
      background-color: var(--color-claude-bg);
      border-color: rgba(245, 158, 11, 0.3);
      align-self: flex-start;
    }

    .message.from-gemini {
      background-color: var(--color-gemini-bg);
      border-color: rgba(56, 189, 248, 0.3);
      align-self: flex-start;
    }

    .message.from-designer {
      background-color: var(--color-designer-bg);
      border-color: rgba(192, 132, 252, 0.35);
      align-self: flex-end;
    }

    .msg-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 11.5px;
    }

    .msg-author {
      font-weight: 700;
      text-transform: capitalize;
    }
    .from-claude .msg-author { color: var(--color-claude); }
    .from-gemini .msg-author { color: var(--color-gemini); }
    .message.from-codex { background-color: var(--color-codex-bg); }
    .from-codex .msg-author { color: var(--color-codex); }
    .message.from-grok { background-color: var(--color-grok-bg); }
    .from-grok .msg-author { color: #fff; background: var(--color-grok); border: 1px solid var(--color-grok-outline); border-radius: 4px; padding: 0 6px; }
    .from-designer .msg-author { color: var(--color-designer); }

    .msg-target {
      color: var(--text-dim);
      font-weight: 500;
    }

    .msg-topic {
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #cbd5e1;
      margin-left: 6px;
    }

    .msg-time {
      color: var(--text-dim);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .msg-text {
      white-space: pre-wrap;
      color: #f1f5f9;
    }

    /* Input area */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .form-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    select, input[type="text"], textarea {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #38bdf8;
    }

    select {
      cursor: pointer;
    }

    .topic-input {
      width: 180px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    button#send-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0 18px;
      height: 48px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    button#send-btn:hover {
      background: #0369a1;
    }

    button#send-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .alert-banner {
      display: none;
      padding: 6px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 12px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .idle-banners-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 2px 16px 0 16px;
      flex-shrink: 0;
      font-size: 11px;
      color: #9ca3af;
    }
    .idle-banners-container:empty { display: none; }

    .idle-banner {
      white-space: nowrap;
    }
    .idle-banner b { color: #f87171; font-weight: 600; }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .tab-btn {
      background: #0b1120;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Board view */
    #board-view {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      flex-direction: column;
      gap: 14px;
    }
    #board-view.visible {
      display: flex;
    }
    #chat-view-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    #chat-view-wrapper.hidden {
      display: none;
    }

    .now-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .now-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .now-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }
    .owner-claude { color: var(--color-claude); }
    .owner-gemini { color: var(--color-gemini); }
    .owner-codex { color: var(--color-codex); }
    .owner-grok { color: #fff; background: var(--color-grok); border: 1px solid var(--color-grok-outline); border-radius: 4px; padding: 0 4px; }
    .owner-designer { color: var(--color-designer); }

    .idle-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .board-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .board-filters select, .board-filters input {
      font-size: 12px;
      padding: 5px 8px;
    }
    .refresh-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #334155; }

    .board-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .board-col {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .board-col-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .board-col-in_progress {
      border-color: rgba(249, 115, 22, 0.55);
      background: rgba(249, 115, 22, 0.08);
    }
    .board-col-in_progress .board-col-title {
      color: #fb923c;
      border-bottom-color: rgba(249, 115, 22, 0.35);
    }
    .board-col-done {
      border-color: rgba(125, 211, 252, 0.5);
      background: rgba(125, 211, 252, 0.07);
    }
    .board-col-done .board-col-title {
      color: #7dd3fc;
      border-bottom-color: rgba(125, 211, 252, 0.35);
    }
    .board-col-in_main {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.07);
    }
    .board-col-in_main .board-col-title {
      color: #4ade80;
      border-bottom-color: rgba(34, 197, 94, 0.35);
    }
    .blocker-chip {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.55);
    }
    .task-progress {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }
    .task-progress-track {
      height: 4px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 3px;
      overflow: hidden;
    }
    .task-progress-fill {
      height: 100%;
      background: #f97316;
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .task-progress-label {
      font-size: 11px;
      color: #fdba74;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .register-footer {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .register-toggle {
      align-self: flex-start;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .register-toggle:hover { color: #e2e8f0; border-color: #64748b; }
    .task-card {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }
    .task-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .task-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800;
      color: #f8fafc;
    }
    .owner-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }
    .task-title {
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.35;
    }
    .task-meta {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .task-chat-line {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      border-left: 2px solid #475569;
      padding: 3px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .doc-link {
      font-size: 11px;
      color: #38bdf8;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Read-only doc modal */
    #doc-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #doc-modal.open { display: flex; }
    .doc-modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      max-width: 780px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .doc-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 700;
    }
    .doc-modal-body {
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #e2e8f0;
    }

    @media (max-width: 720px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
      }
      .presence-bar {
        flex-wrap: wrap;
        gap: 10px;
      }
      .board-columns {
        grid-template-columns: 1fr;
      }
    }

    /* Machines view */
    #machines-view { display: none; flex: 1; overflow-y: auto; padding: 14px 16px; flex-direction: column; gap: 12px; }
    #machines-view.visible { display: flex; }
    .mach-card { background: #0b1120; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    .mach-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; margin-bottom: 8px; }
    .mach-head strong { font-size: 14px; }
    .mach-load { font-size: 12px; color: var(--text-muted); }
    .mach-down { color: #f87171; font-size: 12px; }
    .mach-item { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 5px 0; border-top: 1px solid var(--border-color); font-size: 13px; }
    .mach-kind { font-size: 11px; font-weight: 700; color: #38bdf8; min-width: 78px; }
    .mach-time { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .mach-prog { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .mach-prog.warn { color: #fbbf24; }
    .mach-bar { flex-basis: 100%; height: 5px; border-radius: 3px; background: #1e293b; overflow: hidden; position: relative; }
    .mach-fill { height: 100%; background: #0ea5e9; border-radius: 3px; transition: width 0.4s ease; }
    .mach-fill.warn { background: #f59e0b; }
    .mach-bar.indet .mach-fill { position: absolute; width: 30%; animation: mach-slide 1.6s ease-in-out infinite; opacity: 0.8; }
    @keyframes mach-slide { 0% { left: -30%; } 100% { left: 100%; } }
    .mach-empty, .mach-foot { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>


  <header>
    <div class="header-left">
      <div class="header-title">
        <span>CodexTactics</span>
        <span class="header-tag">Дизайнер</span>
      </div>
      <div id="editor-banner" title="Редактор: зелёный — можно открывать, оранжевый — идёт сборка/работа, красный — нельзя"><button id="eb-btn" aria-label="Статус редактора"></button><div id="eb-pop"><div class="eb-reason">Статус редактора…</div><div class="eb-detail"></div></div></div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-chat">Чат</button>
        <button class="tab-btn" id="tab-board">Задачи</button>
        <button class="tab-btn" id="tab-machines">Машины</button>
      </div>
    </div>
    <div class="presence-bar">
      <div class="presence-item" id="presence-claude" title="Claude Code">
        <span class="status-dot" id="dot-claude"></span>
        <span>Claude: <strong id="status-claude">офлайн</strong></span>
      </div>
      <div class="presence-item" id="presence-gemini" title="Gemini Antigravity">
        <span class="status-dot" id="dot-gemini"></span>
        <span>Gemini: <strong id="status-gemini">офлайн</strong></span>
      </div>
      <div class="presence-item" id="presence-codex" title="Codex (OpenAI)">
        <span class="status-dot" id="dot-codex"></span>
        <span>Codex: <strong id="status-codex">офлайн</strong></span>
      </div>
      <div class="presence-item" id="presence-grok" title="Grok (xAI)">
        <span class="status-dot" id="dot-grok"></span>
        <span>Grok: <strong id="status-grok">офлайн</strong></span>
      </div>
    </div>
  </header>

  <div id="chat-view-wrapper">
  <div id="idle-banners-container" class="idle-banners-container"></div>
  <div id="status-strip" aria-label="STATUS"></div>
  <main id="messages-container">
    <!-- Messages injected by JS -->
  </main>

  <footer>
    <div class="alert-banner" id="error-banner"></div>
    <div class="form-controls">
      <div class="control-group">
        <label for="to-select">Кому:</label>
        <select id="to-select">
          <option value="all">Все (all)</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
          <option value="codex">Codex</option>
          <option value="grok">Grok</option>
        </select>
      </div>

      <div class="control-group">
        <label for="topic-input">Тема:</label>
        <input type="text" id="topic-input" class="topic-input" placeholder="например: combat_lab, bugs" />
      </div>
    </div>

    <div class="input-row">
      <textarea id="message-text" placeholder="Сообщение для агентов... (Enter — отправить, Shift+Enter — перенос строки)"></textarea>
      <button id="send-btn">Отправить</button>
    </div>
  </footer>
  </div>

  <section id="board-view" aria-label="Живая доска задач">
    <div class="now-strip" id="now-strip"></div>
    <div class="board-filters">
      <select id="filter-owner">
        <option value="all">Все агенты</option>
        <option value="codex">Codex</option>
        <option value="grok">Grok</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
      </select>
      <select id="filter-state">
        <option value="all">Все статусы</option>
        <option value="queued">В очереди</option>
        <option value="in_progress">В работе</option>
        <option value="done">Готово (ревью)</option>
        <option value="in_main">В main</option>
        <option value="not_started">Не начато (реестр)</option>
      </select>
      <select id="filter-area">
        <option value="all">Все области</option>
      </select>
      <input type="text" id="filter-search" placeholder="Поиск (id / тема)..." />
      <button class="refresh-btn" id="refresh-board-btn">Обновить</button>
      <span class="idle-badge" id="board-updated-at">загрузка...</span>
    </div>
    <div class="board-columns" id="board-columns"></div>
  </section>

  <section id="machines-view" aria-label="Машины">
    <div id="machines-body"></div>
    <div class="mach-foot">обновлено <span id="machines-updated">…</span></div>
  </section>

  <div id="doc-modal" role="dialog" aria-modal="true">
    <div class="doc-modal-card">
      <div class="doc-modal-head">
        <span id="doc-modal-title">Документ</span>
        <button class="refresh-btn" id="doc-modal-close">Закрыть</button>
      </div>
      <div class="doc-modal-body" id="doc-modal-body"></div>
    </div>
  </div>

  <script>
    (function () {
      const container = document.getElementById('messages-container');
      const textInput = document.getElementById('message-text');
      const sendBtn = document.getElementById('send-btn');
      const toSelect = document.getElementById('to-select');
      const topicInput = document.getElementById('topic-input');
      const errorBanner = document.getElementById('error-banner');
      
      const dotClaude = document.getElementById('dot-claude');
      const statusClaude = document.getElementById('status-claude');
      const dotGemini = document.getElementById('dot-gemini');
      const statusGemini = document.getElementById('status-gemini');

      let lastMessageId = 0;
      let shouldAutoScroll = true;

      // Track user scrolling
      container.addEventListener('scroll', () => {
        const threshold = 60;
        shouldAutoScroll = (container.scrollHeight - container.scrollTop - container.clientHeight) < threshold;
      });

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = 'block';
        setTimeout(() => {
          errorBanner.style.display = 'none';
        }, 6000);
      }

      function formatTime(isoStr) {
        if (!isoStr) return '';
        try {
          const d = new Date(isoStr);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        } catch {
          return isoStr.split('T')[1]?.slice(0, 8) || isoStr;
        }
      }

      function renderMessage(msg) {
        const div = document.createElement('div');
        const from = (msg.from || 'unknown').toLowerCase();
        div.className = `message from-${from}`;

        const header = document.createElement('div');
        header.className = 'msg-header';

        const leftInfo = document.createElement('div');
        const author = document.createElement('span');
        author.className = 'msg-author';
        author.textContent = msg.from;
        leftInfo.appendChild(author);

        const target = document.createElement('span');
        target.className = 'msg-target';
        target.textContent = ` → ${msg.to}`;
        leftInfo.appendChild(target);

        if (msg.topic) {
          const topic = document.createElement('span');
          topic.className = 'msg-topic';
          topic.textContent = msg.topic;
          leftInfo.appendChild(topic);
        }

        const time = document.createElement('span');
        time.className = 'msg-time';
        time.textContent = `${formatTime(msg.ts)} (#${msg.id})`;

        header.appendChild(leftInfo);
        header.appendChild(time);

        const text = document.createElement('div');
        text.className = 'msg-text';
        text.textContent = msg.text;

        div.appendChild(header);
        div.appendChild(text);
        return div;
      }

      function updateIdleBanners(idle) {
        const bannersContainer = document.getElementById('idle-banners-container');
        if (!bannersContainer || !idle) return;

        bannersContainer.innerHTML = '';
        const participants = [
          { key: 'claude', name: 'Claude' },
          { key: 'gemini', name: 'Gemini' },
          { key: 'codex', name: 'Codex' },
          { key: 'grok', name: 'Grok' }
        ];

        participants.forEach(({ key, name }) => {
          const sec = idle[key] || 0;
          if (sec > 600) {
            const mins = Math.floor(sec / 60);
            const banner = document.createElement('div');
            banner.className = 'idle-banner';
            banner.id = `idle-banner-${key}`;
            const shown = mins >= 120 ? `${Math.floor(mins / 60)} ч` : `${mins} мин`;
            banner.innerHTML = '';
            const who = document.createElement('b');
            who.textContent = name;
            banner.appendChild(who);
            banner.appendChild(document.createTextNode(` спит ${shown}`));
            bannersContainer.appendChild(banner);
          }
        });
      }

      function updateStatusStrip(status) {
        const strip = document.getElementById('status-strip');
        if (!strip || !status) return;
        strip.innerHTML = '';
        Object.keys(status).sort().forEach(agent => {
          const st = status[agent];
          const item = document.createElement('span');
          item.className = 'st-item';
          item.title = st.topic ? `[${st.topic}] ${st.text}` : st.text;
          const name = document.createElement('span');
          name.className = 'st-agent';
          name.textContent = `STATUS ${agent}: `;
          item.appendChild(name);
          item.appendChild(document.createTextNode(`${st.text} (${formatTime(st.ts)})`));
          strip.appendChild(item);
        });
      }

      async function fetchMessages() {
        try {
          const res = await fetch(`/api/messages?since=${lastMessageId}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.idle) {
            updateIdleBanners(data.idle);
          }
          updateStatusStrip(data.status);
          const msgs = data.messages || [];
          if (msgs.length > 0) {
            msgs.forEach(m => {
              container.appendChild(renderMessage(m));
              if (m.id > lastMessageId) lastMessageId = m.id;
            });
            if (shouldAutoScroll) {
              container.scrollTop = container.scrollHeight;
            }
          }
        } catch (e) {
          console.warn('Error fetching messages:', e);
        }
      }

      async function fetchPresence() {
        try {
          const res = await fetch('/api/presence');
          if (!res.ok) return;
          const pres = await res.json();
          
          if (pres.idle) {
            updateIdleBanners(pres.idle);
          }

          if (pres.claude && pres.claude.active) {
            dotClaude.className = 'status-dot active';
            statusClaude.textContent = 'слушает';
          } else {
            dotClaude.className = 'status-dot';
            statusClaude.textContent = 'офлайн';
          }

          if (pres.gemini && pres.gemini.active) {
            dotGemini.className = 'status-dot active';
            statusGemini.textContent = 'слушает';
          } else {
            dotGemini.className = 'status-dot';
            statusGemini.textContent = 'офлайн';
          }
          const dotCodex = document.getElementById('dot-codex');
          const statusCodex = document.getElementById('status-codex');
          if (dotCodex && statusCodex) {
            const codexOn = !!(pres.codex && pres.codex.active);
            dotCodex.className = codexOn ? 'status-dot active' : 'status-dot';
            statusCodex.textContent = codexOn ? 'слушает' : 'офлайн';
          }
          const dotGrok = document.getElementById('dot-grok');
          const statusGrok = document.getElementById('status-grok');
          if (dotGrok && statusGrok) {
            const grokOn = !!(pres.grok && pres.grok.active);
            dotGrok.className = grokOn ? 'status-dot active' : 'status-dot';
            statusGrok.textContent = grokOn ? 'слушает' : 'офлайн';
          }
        } catch (e) {
          console.warn('Error fetching presence:', e);
        }
      }

      async function sendMessage() {
        const text = textInput.value.trim();
        if (!text) return;

        const to = toSelect.value;
        const topic = topicInput.value.trim();

        sendBtn.disabled = true;
        try {
          const res = await fetch('/api/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to, topic, text })
          });
          const result = await res.json();
          if (res.ok && result.success) {
            textInput.value = '';
            shouldAutoScroll = true;
            await fetchMessages();
          } else {
            showError(result.error || 'Ошибка отправки сообщения');
          }
        } catch (e) {
          showError(`Сетевая ошибка: ${e.message}`);
        } finally {
          sendBtn.disabled = false;
          textInput.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Initial loads & polling loops
      fetchMessages();
      fetchPresence();
      setInterval(fetchMessages, 2000);
      setInterval(fetchPresence, 2000);

      // --- Живая доска задач (031) ---
      const tabChat = document.getElementById('tab-chat');
      const tabBoard = document.getElementById('tab-board');
      const chatWrapper = document.getElementById('chat-view-wrapper');
      const boardView = document.getElementById('board-view');
      const nowStrip = document.getElementById('now-strip');
      const boardCols = document.getElementById('board-columns');
      const filterOwner = document.getElementById('filter-owner');
      const filterState = document.getElementById('filter-state');
      const filterArea = document.getElementById('filter-area');
      const filterSearch = document.getElementById('filter-search');
      const refreshBoardBtn = document.getElementById('refresh-board-btn');
      const boardUpdatedAt = document.getElementById('board-updated-at');
      const docModal = document.getElementById('doc-modal');
      const docModalTitle = document.getElementById('doc-modal-title');
      const docModalBody = document.getElementById('doc-modal-body');
      const docModalClose = document.getElementById('doc-modal-close');

      let boardData = null;

      const tabMachines = document.getElementById('tab-machines');
      const machinesView = document.getElementById('machines-view');
      const machinesBody = document.getElementById('machines-body');
      const machinesUpdated = document.getElementById('machines-updated');
      let machinesTimer = null;

      function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

      function renderMachines(data) {
        const order = ['local', 'worker'];
        machinesBody.innerHTML = order.map((k) => {
          const m = (data.machines || {})[k];
          if (!m) return '';
          const down = m.status === 'недоступен';
          const load = down ? `<span class="mach-down">${esc(m.error)}</span>`
            : `<span class="mach-load">CPU ${m.cpu == null ? '?' : esc(m.cpu) + '%'} · свободно ${m.free_gb == null ? '?' : esc(m.free_gb)} ГБ RAM</span>`;
          const items = (m.items || []).map((i) => {
            const run = i.running_min == null ? '' : `с ${esc(i.started)} · ${esc(i.running_min)} мин`;
            const cnt = i.count > 1 ? ` ×${i.count}` : '';
            const pg = i.progress || { indeterminate: true, text: '' };
            const warn = pg.state === 'warn' ? ' warn' : '';
            let ptxt = esc(pg.text || '');
            if (!pg.indeterminate && pg.eta_min != null) ptxt += ` · ~${esc(pg.eta_min)} мин`;
            const bar = pg.indeterminate
              ? '<div class="mach-bar indet"><div class="mach-fill"></div></div>'
              : `<div class="mach-bar"><div class="mach-fill${warn}" style="width:${Math.max(2, Number(pg.pct) || 0)}%"></div></div>`;
            return `<div class="mach-item"><span class="mach-kind">${esc(i.kind)}</span><span>${esc(i.label)}${cnt}</span><span class="mach-prog${warn}">${ptxt}</span><span class="mach-time">${run}</span>${bar}</div>`;
          }).join('');
          const body = down ? '' : (items || '<div class="mach-empty">ничего не запущено</div>');
          return `<div class="mach-card"><div class="mach-head"><strong>${esc(m.name)}</strong><span class="mach-load">${esc(m.status)}</span>${load}</div>${body}</div>`;
        }).join('');
        machinesUpdated.textContent = data.updated || '';
      }

      async function fetchMachines() {
        try {
          const res = await fetch('/api/machines');
          renderMachines(await res.json());
        } catch (err) {
          machinesUpdated.textContent = 'ошибка загрузки';
        }
      }

      function switchTab(tabName) {
        const isBoard = tabName === 'board';
        const isMach = tabName === 'machines';
        tabChat.classList.toggle('active', !isBoard && !isMach);
        tabBoard.classList.toggle('active', isBoard);
        tabMachines.classList.toggle('active', isMach);
        chatWrapper.classList.toggle('hidden', isBoard || isMach);
        boardView.classList.toggle('visible', isBoard);
        machinesView.classList.toggle('visible', isMach);
        if (isBoard && !boardData) {
          fetchBoard(false);
        }
        if (machinesTimer) { clearInterval(machinesTimer); machinesTimer = null; }
        if (isMach) {
          fetchMachines();
          machinesTimer = setInterval(fetchMachines, 15000);
        }
      }

      tabChat.addEventListener('click', () => switchTab('chat'));
      tabBoard.addEventListener('click', () => switchTab('board'));
      tabMachines.addEventListener('click', () => switchTab('machines'));

      async function openPortDoc(relPath) {
        docModalTitle.textContent = relPath;
        docModalBody.textContent = 'Загрузка...';
        docModal.classList.add('open');
        try {
          const res = await fetch(`/api/port-doc?path=${encodeURIComponent(relPath)}`);
          const data = await res.json();
          docModalBody.textContent = res.ok ? data.content : (data.error || 'Не удалось загрузить файл');
        } catch (err) {
          docModalBody.textContent = `Ошибка: ${err.message}`;
        }
      }

      docModalClose.addEventListener('click', () => docModal.classList.remove('open'));
      docModal.addEventListener('click', (e) => {
        if (e.target === docModal) docModal.classList.remove('open');
      });

      function renderBoard() {
        if (!boardData) return;
        boardUpdatedAt.textContent = `обновлено: ${formatTime(boardData.generated_at)}`;

        // Areas dropdown
        const prevArea = filterArea.value;
        filterArea.innerHTML = '<option value="all">Все области</option>';
        (boardData.areas || []).forEach(a => {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a;
          filterArea.appendChild(opt);
        });
        if (prevArea && [...filterArea.options].some(o => o.value === prevArea)) {
          filterArea.value = prevArea;
        }

        // Now strip
        nowStrip.innerHTML = '';
        ['codex', 'gemini', 'claude', 'grok'].forEach(ag => {
          const info = (boardData.now_strip || {})[ag] || { agent: ag, state: 'idle' };
          const card = document.createElement('div');
          card.className = 'now-card';

          const head = document.createElement('div');
          head.className = 'now-card-head';
          const nameSpan = document.createElement('span');
          nameSpan.className = `owner-${ag}`;
          nameSpan.textContent = ag.toUpperCase();
          const idleSpan = document.createElement('span');
          idleSpan.className = 'idle-badge';
          idleSpan.textContent = info.idle_min !== null && info.idle_min !== undefined
            ? `idle for ${info.idle_min} min`
            : 'нет данных';
          head.appendChild(nameSpan);
          head.appendChild(idleSpan);

          const body = document.createElement('div');
          body.className = 'task-meta';
          body.textContent = info.task_id
            ? `${info.task_id} (${info.state}): ${info.task_title || ''}`
            : 'нет активной задачи';

          card.appendChild(head);
          card.appendChild(body);
          nowStrip.appendChild(card);
        });

        const ownerVal = filterOwner.value;
        const stateVal = filterState.value;
        const areaVal = filterArea.value;
        const q = filterSearch.value.trim().toLowerCase();

        const columnsDef = [
          ['queued', 'В очереди'],
          ['in_progress', 'В работе'],
          ['done', 'Готово (ревью)'],
          ['in_main', 'В main'],
        ];

        boardCols.innerHTML = '';
        if (stateVal !== 'not_started') {
          columnsDef.forEach(([stKey, stLabel]) => {
            if (stateVal !== 'all' && stateVal !== stKey) return;
            const list = (boardData.tasks || []).filter(t => {
              const matchesCol = stKey === 'in_progress' ? (t.state === 'in_progress' || t.state === 'waiting') : (t.state === stKey);
              if (!matchesCol) return false;
              if (ownerVal !== 'all' && t.owner !== ownerVal) return false;
              if (areaVal !== 'all' && t.area !== areaVal) return false;
              if (q && !(t.id + ' ' + t.title + ' ' + (t.title_ru || '') + ' ' + (t.branch || '')).toLowerCase().includes(q)) return false;
              return true;
            });

            const col = document.createElement('div');
            col.className = `board-col board-col-${stKey}`;
            const colHead = document.createElement('div');
            colHead.className = 'board-col-title';
            const titleSpan = document.createElement('span');
            titleSpan.textContent = stLabel;
            const countSpan = document.createElement('span');
            countSpan.textContent = String(list.length);
            colHead.appendChild(titleSpan);
            colHead.appendChild(countSpan);
            col.appendChild(colHead);

            list.forEach(t => {
              const card = document.createElement('div');
              card.className = 'task-card';

              const top = document.createElement('div');
              top.className = 'task-card-top';
              const idEl = document.createElement('span');
              idEl.className = 'task-id';
              idEl.textContent = t.id;
              const ownerEl = document.createElement('span');
              ownerEl.className = `owner-pill owner-${t.owner}`;
              ownerEl.textContent = t.moved_note ? `${t.owner} (${t.moved_note})` : t.owner;
              top.appendChild(idEl);
              if (t.state === 'waiting' || t.blocked) {
                const blockerEl = document.createElement('span');
                blockerEl.className = 'blocker-chip';
                blockerEl.textContent = 'блокер';
                top.appendChild(blockerEl);
              }
              top.appendChild(ownerEl);
              card.appendChild(top);

              const titleEl = document.createElement('div');
              titleEl.className = 'task-title';
              titleEl.textContent = t.title_ru && t.title_ru !== t.title ? `${t.title_ru} · ${t.title}` : t.title;
              card.appendChild(titleEl);

              if (stKey === 'in_progress' && (t.progress_total > 0 || t.progress_done !== null)) {
                const pWrap = document.createElement('div');
                pWrap.className = 'task-progress';
                const total = t.progress_total > 0 ? t.progress_total : 1;
                const done = Math.min(total, Math.max(0, t.progress_done || 0));
                const pct = Math.round((done / total) * 100);
                const track = document.createElement('div');
                track.className = 'task-progress-track';
                const fill = document.createElement('div');
                fill.className = 'task-progress-fill';
                fill.style.width = `${pct}%`;
                track.appendChild(fill);
                pWrap.appendChild(track);
                const label = document.createElement('div');
                label.className = 'task-progress-label';
                const parts = [t.progress_total > 0 ? `${done}/${total}` : 'в работе'];
                if (t.progress_step) parts.push(t.progress_step);
                if (t.idle_min !== null && t.idle_min !== undefined) parts.push(`${t.idle_min} мин назад`);
                label.textContent = parts.join(' · ');
                pWrap.appendChild(label);
                card.appendChild(pWrap);
              }

              if (t.branch || t.idle_min !== null) {
                const metaEl = document.createElement('div');
                metaEl.className = 'task-meta';
                const parts = [];
                if (t.branch) parts.push(`${t.branch}${t.last_commit ? ' @ ' + t.last_commit : ''}`);
                if (t.idle_min !== null) parts.push(`idle ${t.idle_min}m`);
                metaEl.textContent = parts.join(' · ');
                card.appendChild(metaEl);
              }

              if (t.last_chat_text) {
                const chatEl = document.createElement('div');
                chatEl.className = 'task-chat-line';
                chatEl.textContent = t.last_chat_text;
                card.appendChild(chatEl);
              }

              const linksEl = document.createElement('div');
              linksEl.className = 'task-links';
              const taskBtn = document.createElement('button');
              taskBtn.className = 'doc-link';
              taskBtn.textContent = 'Задача';
              taskBtn.addEventListener('click', () => openPortDoc(t.task_file));
              linksEl.appendChild(taskBtn);
              if (t.report_file) {
                const repBtn = document.createElement('button');
                repBtn.className = 'doc-link';
                repBtn.textContent = 'Отчёт';
                repBtn.addEventListener('click', () => openPortDoc(t.report_file));
                linksEl.appendChild(repBtn);
              }
              card.appendChild(linksEl);
              col.appendChild(card);
            });

            boardCols.appendChild(col);
          });
        }

        const boardParent = boardCols.parentElement;
        if (boardParent) {
          boardParent.querySelectorAll('.register-footer').forEach(el => el.remove());
        }

        if (stateVal === 'all' || stateVal === 'not_started') {
          const allReg = (boardData.not_started_register || []).filter(r => {
            if (areaVal !== 'all' && r.area !== areaVal) return false;
            if (q && !(r.id + ' ' + r.name + ' ' + r.area).toLowerCase().includes(q)) return false;
            return true;
          });
          const regList = allReg.slice(0, 40);
          if (regList.length > 0 && boardParent) {
            const footer = document.createElement('div');
            footer.className = 'register-footer';

            let isOpen = false;
            try {
              isOpen = localStorage.getItem('agent_chat_register_open') === '1';
            } catch (_) {
              isOpen = false;
            }
            if (stateVal === 'not_started') {
              isOpen = true;
            }

            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'register-toggle';
            const totalReg = (boardData.not_started_register || []).length;
            const updateLabel = (open) => {
              toggleBtn.textContent = (open ? '▾ ' : '▸ ') + 'Реестр (' + totalReg + ')';
            };
            updateLabel(isOpen);

            const regGrid = document.createElement('div');
            regGrid.className = 'register-grid';
            regGrid.style.display = isOpen ? 'grid' : 'none';

            regList.forEach(r => {
              const card = document.createElement('div');
              card.className = 'task-card';
              const top = document.createElement('div');
              top.className = 'task-card-top';
              const idEl = document.createElement('span');
              idEl.className = 'task-id';
              idEl.textContent = r.id;
              const areaEl = document.createElement('span');
              areaEl.className = 'idle-badge';
              areaEl.textContent = r.area || '';
              top.appendChild(idEl);
              top.appendChild(areaEl);
              const titleEl = document.createElement('div');
              titleEl.className = 'task-title';
              titleEl.textContent = r.name;
              card.appendChild(top);
              card.appendChild(titleEl);
              regGrid.appendChild(card);
            });

            toggleBtn.addEventListener('click', () => {
              isOpen = !isOpen;
              regGrid.style.display = isOpen ? 'grid' : 'none';
              updateLabel(isOpen);
              try {
                localStorage.setItem('agent_chat_register_open', isOpen ? '1' : '0');
              } catch (_) {}
            });

            footer.appendChild(toggleBtn);
            footer.appendChild(regGrid);
            boardParent.appendChild(footer);
          }
        }
      }

      async function fetchBoard(forceRefresh) {
        try {
          const res = await fetch(`/api/task-board${forceRefresh ? '?refresh=1' : ''}`);
          if (!res.ok) return;
          boardData = await res.json();
          renderBoard();
        } catch (err) {
          console.warn('Error fetching task board:', err);
        }
      }

      [filterOwner, filterState, filterArea].forEach(el => el.addEventListener('change', renderBoard));
      filterSearch.addEventListener('input', renderBoard);
      refreshBoardBtn.addEventListener('click', () => fetchBoard(true));
      setInterval(() => {
        if (boardView.classList.contains('visible')) {
          fetchBoard(false);
        }
      }, 30000);
    })();
    (function () {
      const banner = document.getElementById('editor-banner');
      const reasonEl = banner.querySelector('.eb-reason');
      const detailEl = banner.querySelector('.eb-detail');
      document.getElementById('eb-btn').addEventListener('click', (e) => { e.stopPropagation(); banner.classList.toggle('open'); });
      document.addEventListener('click', (e) => { if (!banner.contains(e.target)) banner.classList.remove('open'); });
      async function pollEditor() {
        try {
          const r = await fetch('/api/editor-status');
          const d = await r.json();
          const v = d.verdict || {};
          banner.className = (v.level || '') + (banner.classList.contains('open') ? ' open' : '');
          banner.title = v.reason || '';
          reasonEl.textContent = v.reason || 'Нет данных';
          detailEl.textContent = (d.worktrees || []).map(w => w.name + ': ' + w.branch + ' ' + w.head + (w.editor_open ? ' [editor]' : '')).join(' | ');
        } catch (e) {
          banner.className = banner.classList.contains('open') ? 'open' : '';
          reasonEl.textContent = 'Статус редактора недоступен';
        }
      }
      pollEditor();
      setInterval(pollEditor, 15000);
    })();
  </script>
</body>
</html>
