; APC P0 (2026-10-12): two nav agents. Index 0 "Default" = the infantry: EXACTLY the engine's former implicit agent
; (FNavigationSystem::FallbackAgentRadius 35 / FallbackAgentHeight 144, no step override -> RecastNavMesh 35 cm), so
; operative / enemy pathing does not change. Index 1 "Vehicle" = the APC (radius 200, height 300, step 40); bCanFly=True
; keeps every ground pawn off it (GetNavDataForProps matches bCanFly) - the vehicle asks for it by name. Keep the order:
; UNavArea_NoVehicle / UNavArea_VehicleHull address the agents by index. The vehicle navmesh is opt-in per
; NavMeshBoundsVolume (tag "VehicleNav", or a vehicle-only volume): UVehicleSubsystem strips it elsewhere at BeginPlay.
+SupportedAgents=(Name="Default",Color=(B=0,G=75,R=38,A=164),DefaultQueryExtent=(X=50.000000,Y=50.000000,Z=250.000000),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=35.000000,AgentHeight=144.000000,AgentStepHeight=-1.000000,NavWalkingSearchHeightScale=0.500000,bCanCrouch=False,bCanJump=False,bCanWalk=False,bCanSwim=False,bCanFly=False)
+SupportedAgents=(Name="Vehicle",Color=(B=20,G=120,R=230,A=164),DefaultQueryExtent=(X=250.000000,Y=250.000000,Z=300.000000),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=200.000000,AgentHeight=300.000000,AgentStepHeight=40.000000,NavWalkingSearchHeightScale=0.500000,bCanCrouch=False,bCanJump=False,bCanWalk=True,bCanSwim=False,bCanFly=True)

